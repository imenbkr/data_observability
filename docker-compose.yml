name: nouvelair-data-observability

services:
  # Single-node Kafka in KRaft mode (no ZooKeeper)
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on: { kafka: { condition: service_healthy } }
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: nouvelair
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # Polls live ADS-B data (adsb.lol) and publishes Nouvelair flights to Kafka
  producer:
    build: ./producer
    restart: unless-stopped
    depends_on: { kafka: { condition: service_healthy } }
    environment:
      POLL_SECONDS: ${POLL_SECONDS:-60}
      USER_AGENT: ${USER_AGENT:-nouvelair-data-observability-demo}
    volumes: [./data:/app/data:ro]

  # Checks data quality and exposes the five-pillar metrics
  consumer:
    build: ./consumer
    restart: unless-stopped
    depends_on: { kafka: { condition: service_healthy } }

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_FEATURE_TOGGLES_ENABLE: dashboard.notebooks
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/nouvelair.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
