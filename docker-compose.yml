name: kafka-data-observability

x-kafka: &kafka
  image: apache/kafka:3.9.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
  environment: &kafka-env
    CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_HEAP_OPTS: -Xms768m -Xmx768m

x-kafka-ready: &kafka-ready
  kafka1: { condition: service_healthy }
  kafka2: { condition: service_healthy }
  kafka3: { condition: service_healthy }

services:
  # --- Kafka cluster: 3 combined broker/controller nodes (KRaft, no ZooKeeper) ---
  kafka1:
    <<: *kafka
    hostname: kafka1
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092 }
    volumes: [kafka1-data:/var/lib/kafka/data]
  kafka2:
    <<: *kafka
    hostname: kafka2
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9092 }
    volumes: [kafka2-data:/var/lib/kafka/data]
  kafka3:
    <<: *kafka
    hostname: kafka3
    environment: { <<: *kafka-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9092 }
    volumes: [kafka3-data:/var/lib/kafka/data]

  # One-shot job: creates the topics, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on: *kafka-ready
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka1:9092
        $$T --bootstrap-server $$B --create --if-not-exists --topic plant.events \
          --partitions 12 --replication-factor 3 \
          --config min.insync.replicas=2 --config retention.ms=604800000 --config compression.type=producer
        $$T --bootstrap-server $$B --create --if-not-exists --topic plant.events.dlq \
          --partitions 3 --replication-factor 3 --config retention.ms=1209600000
        $$T --bootstrap-server $$B --describe --topic plant.events

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    depends_on: *kafka-ready
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: plant
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:9092,kafka2:9092,kafka3:9092

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    restart: unless-stopped
    depends_on: *kafka-ready
    command: ["--kafka.server=kafka1:9092", "--kafka.server=kafka2:9092", "--kafka.server=kafka3:9092"]

  # --- Data lake: S3 on LocalStack ---
  localstack:
    image: localstack/localstack
    ports: ["${LOCALSTACK_PORT:-4566}:4566"]
    environment:
      - SERVICES=s3
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./.localstack:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # --- Pipeline ---
  producer:
    build: ./producer
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    deploy: { replicas: 2 }
    environment:
      EVENTS_PER_SEC: ${EVENTS_PER_SEC:-5000}
      INCIDENT_EVERY_MIN: ${INCIDENT_EVERY_MIN:-30}
      SCHEMA_BREAK_RATE: ${SCHEMA_BREAK_RATE:-0.001}

  etl-consumer:
    build: ./etl-consumer
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    deploy: { replicas: 3 }
    environment:
      BUCKET: plant-lake
      S3_ENDPOINT: http://localstack:4566

  # --- Observability ---
  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports: ["9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["3000:3000"]
    environment:
      GF_FEATURE_TOGGLES_ENABLE: dashboard.notebooks
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/data-health.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  prometheus-data:
  grafana-data:
