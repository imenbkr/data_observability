groups:
  - name: flights-data-observability-alerts
    rules:
      - alert: NoFlightsWhileExpected
        expr: flights_active == 0 and flights:active:yesterday >= 3
        for: 30m
        labels: { pillar: volume, team: data-engineering, severity: page }
        annotations:
          summary: "No Tunisia flights tracked, but {{ $value }} were airborne at this time yesterday"

      - alert: SourceApiFailing
        expr: adsb:api_errors:ratio > 0.2
        for: 10m
        labels: { pillar: volume, team: data-engineering, severity: page }
        annotations:
          summary: "{{ $value | humanizePercentage }} of adsb.lol requests are failing"

      - alert: PipelineStalled
        expr: time() - (producer_last_poll_timestamp_seconds > 0) > 300
        labels: { pillar: freshness, team: data-engineering, severity: page }
        annotations:
          summary: "The producer has not completed a poll for {{ $value | humanizeDuration }}"

      - alert: PositionsStale
        expr: flights:position_age:p95 > 180
        for: 15m
        labels: { pillar: freshness, team: data-engineering, severity: warning }
        annotations:
          summary: "p95 position age is {{ $value | humanizeDuration }}"

      - alert: InvalidMessages
        expr: flights:invalid:ratio > 0.05
        for: 15m
        labels: { pillar: schema, team: data-engineering, severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of messages fail validation"

      - alert: RouteReferenceDataOutdated
        expr: flights:unknown_route:ratio > 0.2
        for: 1h
        labels: { pillar: distribution, team: data-engineering, severity: info }
        annotations:
          summary: "{{ $value | humanizePercentage }} of positions have no known route: run scripts/build_routes.py"

      - alert: MessagesLostInPipeline
        expr: flights:completeness:ratio < 0.95 and sum(rate(producer_messages_sent_total[10m])) > 0
        for: 15m
        labels: { pillar: lineage, team: data-engineering, severity: warning }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of produced messages reach the consumer"

  - name: volume-drop-alerts
    rules:
      # High-frequency data: compare the live stream with the same moment yesterday
      - alert: SourceVolumeBelowBaseline
        expr: sum(adsb_aircraft_in_areas) < 0.5 * sum(adsb_aircraft_in_areas offset 1d)
        for: 15m
        labels: { pillar: volume, team: data-engineering, severity: warning }
        annotations:
          summary: "adsb.lol returns {{ $value }} aircraft, less than half of yesterday at this time"
      - alert: SourceDataMissing
        expr: absent_over_time(adsb_aircraft_in_areas[10m])
        labels: { pillar: volume, team: data-engineering, severity: page }
        annotations:
          summary: "No aircraft data from adsb.lol for 10 minutes"
      # Low-frequency data: Step 4, current hourly count below the forecast's lower bound.
      # The last line keeps the alert quiet at night, when there is no traffic to forecast.
      - alert: FlightVolumeBelowForecast
        expr: |
          flights:positions:count1h < flights:positions:lower_bound
          and on() flights:positions:count1h offset 1d > 100
        for: 10m
        labels: { pillar: volume, team: data-engineering, severity: warning }
        annotations:
          summary: "Only {{ $value | humanize }} flight positions in the last hour, below the forecast's lower bound"

  - name: capacity-alerts
    rules:
      - alert: ActiveSeriesLimitWithin7Days
        expr: monitoring:active_series:predicted_7d > 0.9 * scalar(monitoring:active_series:limit)
        for: 1h
        labels: { pillar: capacity, team: data-engineering, severity: warning }
        annotations:
          summary: "At the current growth rate, active series reach {{ $value | humanize }} within 7 days (limit 10,000)"

  - name: delay-alerts
    rules:
      - alert: ArrivalDelaysHigh
        expr: |
          airport:arrival_delay:avg3h > 45
          and sum by (airport) (increase(airport_arrival_delay_minutes_count[3h])) >= 5
        for: 30m
        labels: { pillar: delays, team: data-engineering, severity: warning }
        annotations:
          summary: "Arrivals at {{ $labels.airport }} are {{ $value | humanize }} min late on average (last 3 h)"
      - alert: LandingDetectionIncomplete
        expr: |
          airport:schedule_match:ratio24h < 0.5
          and sum by (airport) (increase(airport_schedule_matches_total{result=~"matched|missed"}[24h])) >= 10
        for: 1h
        labels: { pillar: lineage, team: data-engineering, severity: warning }
        annotations:
          summary: "Only {{ $value | humanizePercentage }} of scheduled arrivals at {{ $labels.airport }} were detected landing"
