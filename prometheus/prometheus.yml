global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: producer
    static_configs: [{ targets: ["producer:8001"] }]
  - job_name: consumer
    static_configs: [{ targets: ["consumer:8000"] }]
  - job_name: schedules
    static_configs: [{ targets: ["schedules:8002"] }]
