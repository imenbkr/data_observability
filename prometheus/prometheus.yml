global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]

  # Docker DNS returns one A record per replica, so scaled services are picked up automatically.
  - job_name: producer
    dns_sd_configs: [{ names: ["producer."], type: A, port: 8001, refresh_interval: 15s }]

  - job_name: etl-consumer
    dns_sd_configs: [{ names: ["etl-consumer."], type: A, port: 8000, refresh_interval: 15s }]

  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
