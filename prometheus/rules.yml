groups:
  - name: flights-data-observability
    interval: 1m
    rules:
      # Volume
      - record: flights:messages:per_minute
        expr: sum(rate(flights_messages_total[5m])) * 60
      - record: flights:active:yesterday
        expr: flights_active offset 1d

      # Freshness
      - record: flights:position_age:p50
        expr: histogram_quantile(0.50, sum by (le) (rate(flights_position_age_seconds_bucket[10m])))
      - record: flights:position_age:p95
        expr: histogram_quantile(0.95, sum by (le) (rate(flights_position_age_seconds_bucket[10m])))
      - record: flights:stage_latency:p95
        expr: histogram_quantile(0.95, sum by (le, stage) (rate(flights_stage_latency_seconds_bucket[10m])))

      # Schema / validity
      - record: flights:invalid:ratio
        expr: |
          sum(rate(flights_invalid_messages_total[30m]))
          / clamp_min(sum(rate(flights_messages_total[30m])), 1e-9)
      - record: flights:unknown_route:ratio
        expr: |
          sum(rate(flights_unknown_route_total[1h]))
          / clamp_min(sum(rate(flights_valid_positions_total[1h])), 1e-9)

      # Lineage: does every record found at the source make it through each stage?
      - record: flights:completeness:ratio
        expr: |
          sum(rate(flights_messages_total[10m]))
          / clamp_min(sum(rate(producer_messages_sent_total[10m])), 1e-9)
      - record: adsb:api_errors:ratio
        expr: |
          sum(rate(adsb_api_requests_total{status!="200"}[10m]))
          / clamp_min(sum(rate(adsb_api_requests_total[10m])), 1e-9)

  # "Detect data volume drops" (see grafana/notebooks/): a one-step-ahead forecast of the
  # hourly record count.
  - name: volume-forecast
    interval: 5m
    rules:
      # Step 3: records received in the last hour (the "current batch")
      - record: flights:positions:count1h
        expr: sum(increase(flights_valid_positions_total[1h]))
      # Step 2: prediction band from the previous 72 hourly samples, excluding the current hour.
      # Computed from the raw counter (not the recorded series) so it has history right away.
      # mean ± 1.645 sd ≈ 90% coverage probability
      - record: flights:positions:forecast_mean
        expr: avg_over_time(sum(increase(flights_valid_positions_total[1h]))[72h:1h] offset 1h)
      - record: flights:positions:lower_bound
        expr: |
          clamp_min(
            avg_over_time(sum(increase(flights_valid_positions_total[1h]))[72h:1h] offset 1h)
            - 1.645 * stddev_over_time(sum(increase(flights_valid_positions_total[1h]))[72h:1h] offset 1h), 0)
      - record: flights:positions:upper_bound
        expr: |
          avg_over_time(sum(increase(flights_valid_positions_total[1h]))[72h:1h] offset 1h)
          + 1.645 * stddev_over_time(sum(increase(flights_valid_positions_total[1h]))[72h:1h] offset 1h)

  # Seasonal baseline: the same hour on each of the last 7 days. The "day" label plus "or"
  # keeps the result valid while fewer than 7 days of history exist.
  - name: volume-forecast-seasonal
    interval: 5m
    rules:
      - record: flights:positions:seasonal_mean
        expr: |
          avg without (day) (
                label_replace(sum(increase(flights_valid_positions_total[1h] offset 1d)), "day", "1", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 2d)), "day", "2", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 3d)), "day", "3", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 4d)), "day", "4", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 5d)), "day", "5", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 6d)), "day", "6", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 7d)), "day", "7", "", "")
          )
      - record: flights:positions:seasonal_stddev
        expr: |
          stddev without (day) (
                label_replace(sum(increase(flights_valid_positions_total[1h] offset 1d)), "day", "1", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 2d)), "day", "2", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 3d)), "day", "3", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 4d)), "day", "4", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 5d)), "day", "5", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 6d)), "day", "6", "", "")
             or label_replace(sum(increase(flights_valid_positions_total[1h] offset 7d)), "day", "7", "", "")
          )
      - record: flights:positions:seasonal_lower
        expr: clamp_min(flights:positions:seasonal_mean - 1.645 * flights:positions:seasonal_stddev, 0)
      - record: flights:positions:seasonal_upper
        expr: flights:positions:seasonal_mean + 1.645 * flights:positions:seasonal_stddev
