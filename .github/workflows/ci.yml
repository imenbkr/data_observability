name: CI

# Runs on every push and pull request. Needs no secrets.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python lint and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff==0.8.4 pillow==11.0.0
      - name: Lint
        run: ruff check producer consumer schedules scripts
      - name: Compile
        run: python -m py_compile producer/*.py consumer/*.py schedules/*.py scripts/*.py
      # Dashboards, notebook and its Markdown export are generated by scripts:
      # fail if someone edited the JSON by hand or forgot to regenerate.
      - name: Generated files are up to date
        run: |
          python scripts/build_dashboard.py
          python scripts/build_notebook.py
          python scripts/build_forecast_dashboard.py
          python scripts/export_notebook_markdown.py
          git diff --exit-code -- grafana docs || {
            echo "::error::Generated files differ. Run 'make notebook' and 'python scripts/build_dashboard.py', then commit."
            exit 1
          }

  configs:
    name: Prometheus, Alloy and Compose configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prometheus config, recording and alerting rules
        run: >
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.4.0 check config /etc/prometheus/prometheus.yml
      - name: Alloy config
        run: docker run --rm -v "$PWD/alloy:/etc/alloy:ro" grafana/alloy:v1.5.1 fmt /etc/alloy/config.alloy
      - name: Docker Compose (both profiles)
        run: |
          COMPOSE_PROFILES=local docker compose config --quiet
          COMPOSE_PROFILES=cloud docker compose config --quiet

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [python]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [producer, consumer, schedules]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/data-observability-${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # Build on every push; publish to ghcr.io only from main
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
